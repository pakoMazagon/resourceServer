openapi: 3.0.0
info:
  title: TPV Mesas API
  version: 1.0.0
paths:
  /mesas:
    get:
      summary: Obtener todas las mesas
      responses:
        '200':
          description: Lista de mesas
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Mesas'
    put:
      summary: Actualiza los datos de una mesa.
      description: Actualiza los datos de una mesa específica en el sistema.
      operationId: updateMesa
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Mesas'
      responses:
        '200':
          description: La mesa se actualizó correctamente.
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                    description: Mensaje de éxito.
                    example: "Mesa actualizada correctamente."
        '400':
          description: Solicitud inválida.
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string
                    description: Descripción del error.
                    example: "El campo 'nombreTradicional' es obligatorio."
        '401':
          description: No autorizado.
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string
                    description: Descripción del error.
                    example: "Token inválido o expirado."
        '500':
          description: Error interno del servidor.
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string
                    description: Descripción del error.
                    example: "Ocurrió un error inesperado."
components:
  schemas:
    Mesas:
      type: object
      properties:
        id:
          type: string
          format: uuid
        numero:
          type: integer
        sector:
          type: string
        nombreTradicional:
          type: string
        nombreActual:
          type: string
        ocupada:
          type: boolean
        camarero:
          type: string
        cantidad:
          type: number
          format: float
        lastUpdatedAt:
          type: string
          format: date-time
        version:
          type: integer
        products:
          type: array
          items:
            $ref: '#/components/schemas/ProductoEnMesa'
    ProductoEnMesa:
      type: object
      properties:
        id:
          type: string
          format: uuid
        nombre:
          type: string
        code:
          type: string
        precio:
          type: number
          format: float
        cantidad:
          type: integer
        estado:
          type: string
        fechaHoraPedido:
          type: string
          format: date-time
