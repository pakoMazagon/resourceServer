openapi: 3.0.0
info:
  title: TPV Products API
  version: 1.0.0
paths:
  /products:
    get:
      summary: Obtener todos los productos
      responses:
        '200':
          description: Lista de productos
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/ProductoBBDD'
  /products/{id}/estado:
    patch:
      summary: Modificar estado del productoEnMesa
      description: Actualiza el estado del productoEnMesa
      operationId: cambiaEstadoProductoEnMesa
      parameters:
        - name: id
          in: path
          required: true
          description: ID del producto a cambiar el estado
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                nuevoEstado:
                  type: string
                  example: "Nuevo estado"
      responses:
        '200':
          description: Nombre de la mesa actualizado correctamente.
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                    example: "Nombre actualizado exitosamente."
        '400':
          description: Solicitud inválida.
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string
        '500':
          description: Error interno del servidor.
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string
components:
  schemas:
    ProductoBBDD:
      type: object
      properties:
        id:
          type: string
          format: uuid
        familia:
          type: string
        nombre:
          type: string
        code:
          type: string
        precio1:
          type: number
        precio2:
          type: number
        precio3:
          type: number
        cocina:
          type: boolean
        seccion:
          type: string
